<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16110f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Musculito: seus treinos com check-in, evolução e animações de cada exercício.">
<title>Musculito · Treinos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Musculito">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7f2; --card:#ffffff; --soft:#fbe9e0; --line:#f0dcd2;
  --text:#2a1f1b; --muted:#8c7a72; --accent:#e8573f; --accent-2:#ffb4a2; --ok:#2f9e6d;
  --fig:#2a1f1b; --fig-far:#c9b4aa; --mat:#ffd9cc; --db:#e8573f; --mq:#9fb0ba; --on-accent:#fff;
  --shadow:0 1px 2px rgba(60,30,20,.06),0 6px 20px rgba(60,30,20,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16110f; --card:#211a17; --soft:#2c221e; --line:#3a2e29;
    --text:#f6ece7; --muted:#a8968e; --accent:#ff7a5f; --accent-2:#7a3a2c; --ok:#4cc38a;
    --fig:#f6ece7; --fig-far:#6e5a52; --mat:#4a2f27; --db:#ff7a5f; --mq:#5d6d76; --on-accent:#141414; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 Inter,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:28px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.block{width:100%;padding:14px}
.btn.sm{padding:6px 12px;font-size:14px}
.icon-btn{border:none;background:var(--soft);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px}
input[type=text],input[type=number],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}

/* Hoje */
.hello{font-size:15px;color:var(--muted)}
.streak{display:flex;gap:12px}
.stat{flex:1;background:var(--soft);border-radius:14px;padding:12px}
.stat b{display:block;font-family:Fraunces,serif;font-size:26px;line-height:1.1}
.week{display:flex;justify-content:space-between;margin-top:14px}
.day{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted)}
.day i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px}
.day.on i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.today{color:var(--text);font-weight:600}
.plan{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.plan .badge{width:52px;height:52px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-family:Fraunces,serif;font-size:24px;font-weight:700;color:var(--accent);flex:none}
.plan .meta{flex:1;min-width:0}
.plan .meta b{display:block}
.tag{display:inline-block;background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;padding:2px 8px;font-weight:600;vertical-align:middle;margin-left:6px}

/* Treino em andamento */
.ex{padding:0;overflow:hidden}
.ex .anim{background:var(--soft);height:clamp(200px,58vw,280px);width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.anim:has(img.gif),.mini:has(img.gif){background:#fff}
.anim,.mini{position:relative;overflow:hidden}
img.gif{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit}
.sem-anim{display:grid;place-items:center;width:100%;height:100%;padding:6px;text-align:center;font-size:11px;color:var(--muted)}
.ex .body{padding:14px 16px 16px}
.ex .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex.done .anim{opacity:.55}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.set{min-width:56px;padding:10px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:600;text-align:center}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.load{display:flex;align-items:center;gap:8px;margin-top:12px}
.load input{width:92px;text-align:center}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
details ul{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}


.timer[hidden]{display:none}
.has-timer{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
/* Timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(640px,calc(100% - 24px));background:var(--text);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.timer b{font-family:Fraunces,serif;font-size:26px;min-width:64px}
.timer .bar{flex:1;height:6px;background:rgba(127,127,127,.35);border-radius:99px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent)}
.timer button{background:transparent;border:1px solid currentColor;border-radius:999px;padding:6px 12px;font-size:14px}

/* Navegação inferior */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs div{display:flex;max-width:680px;width:100%}
nav.tabs button{flex:1;background:none;border:none;display:grid;justify-items:center;gap:2px;padding:8px 0;font-size:12px;color:var(--muted);border-radius:12px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:600}

/* Evolução */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:12px}
.cal span{font-size:11px;color:var(--muted)}
.cal i{font-style:normal;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;background:var(--soft)}
.cal i.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.cal i.empty{background:transparent}
.cal i.today{outline:2px solid var(--accent);outline-offset:-2px}
.chart{width:100%;height:auto;margin-top:10px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent)}
.chart .ax{stroke:var(--line)}
.chart text{fill:var(--muted);font-size:11px;font-family:Inter,sans-serif}
.row{display:flex;gap:8px;align-items:center}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:none}
.mini{width:56px;height:52px;border-radius:10px;background:var(--soft);flex:none}
.mini svg{width:100%;height:100%}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;border:none;background:none;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:14px}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:600}

dialog{border:none;border-radius:20px;padding:0;background:var(--card);color:var(--text);width:min(560px,calc(100vw - 20px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(20,10,8,.5)}
.dlg{padding:18px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lib button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 6px 10px;text-align:left;font-size:13px}
.lib .mini{width:100%;height:auto;aspect-ratio:240/218}
.lib b{display:block;font-weight:500;margin:6px 4px 0}
.lib small{color:var(--muted);margin:0 4px}
.celebrate{text-align:center;padding:28px 20px}
.celebrate .big{font-size:54px}
.empty-note{text-align:center;color:var(--muted);padding:20px}

/* Grade, busca e arrastar */
.badge{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-family:Fraunces,serif;font-size:17px;font-weight:700;color:var(--accent);flex:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{min-width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600;display:grid;place-items:center;flex:none}
.sort-item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .18s ease,box-shadow .18s}
.sort-item input{-webkit-user-select:text;user-select:text}
.sort-item.dragging{transition:box-shadow .18s;position:relative;z-index:30;box-shadow:0 16px 36px rgba(60,30,20,.25);outline:2px solid var(--accent)}
.drag{border:none;background:none;color:var(--muted);font-size:22px;line-height:1;padding:8px 4px;margin-left:-6px;cursor:grab;touch-action:none;border-radius:8px}
.libbox{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.stack{grid-template-columns:minmax(0,1fr)}
.libq{width:100%;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:12px 16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.lib button{position:relative}
.lib .have{position:absolute;top:10px;left:10px;background:var(--ok);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;z-index:1}
.lib .addlbl{display:block;color:var(--accent);font-weight:600;margin:6px 4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast[hidden]{display:none}

/* Assistente e perfil */
.coach{border:1.5px solid var(--accent-2)}
.coach-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.coach-ic{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:16px;flex:none}
.coach-sub{font-size:16px;margin:14px 0 8px}
.tips{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.tip-ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:var(--soft)}
.tip.ok .tip-ic{background:var(--ok);color:#fff}
.tip.atencao .tip-ic{background:#e9a23b;color:#fff}
.link{background:none;border:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;font-size:14px}
.sug{display:grid;gap:8px}
.sug-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 12px 6px 6px}
.sug-item .mini{width:52px;height:48px}
.sug-item small{display:block;font-size:12px}
.plus{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:20px;flex:none}
.ia{margin-top:14px;display:grid;gap:6px}
.ia-r{white-space:pre-wrap;font-size:14px}
.opts{border:none;padding:0;margin:4px 0 0;display:grid;gap:6px}
.opts legend{margin-bottom:6px;padding:0}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.opt input{accent-color:var(--accent)}
.plan.vazio{border-style:dashed;box-shadow:none}
.andamento{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1.5px solid var(--accent);background:var(--soft);margin-bottom:12px}
.andamento .btn{flex:none}

/* Cabeçalho, card de check-in */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hd-logo .mascote{width:34px;height:34px}
.hd-saud{color:var(--muted);font-size:15px}
.hd-saud b{color:var(--text);font-weight:600}
.hd-tit{font-size:30px;margin:4px 0 14px}
.sec-tit{font-size:21px;margin:6px 0 0}
.mascote .m-corpo,.mascote .m-braco *{fill:#fff7f2}
.mascote .m-faixa{fill:var(--accent)}
.mascote .m-olho{fill:#2a1f1b}.mascote .m-boca{stroke:#2a1f1b}.mascote .m-boch{fill:#ffb4a2}
.hd-logo .mascote,.ci-masc{background:var(--accent);border-radius:12px}
.ci-card{position:relative;display:grid;gap:14px;overflow:hidden}
.ci-badge{position:absolute;top:0;right:0;background:var(--ok);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:5px 12px;border-bottom-left-radius:12px}
.ci-top{display:flex;gap:12px;align-items:center}
.ci-top b{display:block;font-size:17px}
.ci-masc{width:52px;height:52px;flex:none}
.ci-desfazer{justify-self:center;font-weight:500;color:var(--muted)}
.ci-card.pendente{border:1.5px dashed var(--accent)}
.ci-btn{font-size:17px;padding:16px}
.streak .stat b{font-size:24px}
.streak .stat .small{font-size:12px}
button.day{border:none;background:none;padding:0;font:inherit;color:inherit}
button.day:disabled{opacity:.45}
.cal button,.cal i{font-style:normal;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;background:var(--soft);border:none;padding:0;color:inherit}
.cal button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.cal button.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal i.futuro{opacity:.4}

/* Animação de check-in */
.cel{position:fixed;inset:0;z-index:100;overflow:hidden;background:var(--bg);color:#fff;opacity:0;transition:opacity .2s}
.cel.go{opacity:1}
.cel.saindo{opacity:0;transition:opacity .25s}
.cel-intro{position:absolute;inset:0;display:grid;place-items:center}
.cel-masc{width:84px;height:84px;background:var(--accent);border-radius:26px;transform:scale(.3) rotate(-30deg);opacity:0}
.cel.go .cel-masc{animation:pulso 1.15s ease-out forwards}
.cel-blob{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;transform:scale(0) rotate(0);fill:var(--accent)}
.cel.go .cel-blob{animation:flor 1.05s 1.05s cubic-bezier(.55,0,.35,1) forwards}
.cel.go .cel-intro{animation:sumir .2s 1.15s forwards}
.cel-final{position:absolute;inset:0;background:var(--accent);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));opacity:0;max-width:680px;margin:0 auto}
.cel.go .cel-final{animation:fadeUp .45s 1.95s ease-out forwards}
.cel-top{display:flex;justify-content:space-between;align-items:center}
.cel-marca{font-family:Fraunces,serif;font-weight:700;font-size:20px}
.cel-x{background:none;border:none;color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%}
.cel-meio{flex:1;display:grid;place-items:center;align-content:center;gap:12px;text-align:center}
.cel-masc2{width:120px;height:120px}
.cel.go .cel-masc2{animation:flex 1.2s 2.1s ease-in-out 2}
.cel-num{font-weight:600;font-size:15px;opacity:.95}
.cel-tit{font-family:Fraunces,serif;font-size:34px;line-height:1.05;margin:0 0 14px;color:#fff}
.cel-card{background:#fff;color:#2a1f1b;border-radius:16px;padding:14px;display:grid;gap:10px}
.cel-card-top{display:flex;gap:12px;align-items:center}
.cel-card .muted{color:#7a6a63}
.cel-mini{width:44px;height:44px;background:var(--accent);border-radius:12px;flex:none}
.cel-linha{font-size:14px;color:#5b4c46}
.cel-btn{margin-top:12px;border:none;border-radius:999px;padding:15px;font-weight:700;font-size:16px;background:#fff;color:var(--accent)}
.cel-btn.sec{background:rgba(255,255,255,.18);color:#fff}
.cel.sem-mov .cel-intro,.cel.sem-mov .cel-blob{display:none}
.cel.sem-mov .cel-final{opacity:1;animation:none}
@keyframes mascIn{0%{opacity:0;transform:scale(.3) rotate(-30deg)}60%{opacity:1;transform:scale(1.15) rotate(8deg)}80%{transform:scale(.95) rotate(-4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes flor{0%{transform:scale(.12) rotate(0)}30%{transform:scale(1) rotate(70deg)}100%{transform:scale(16) rotate(260deg)}}
@keyframes pulso{0%{opacity:0;transform:scale(.45)}30%{opacity:.55;transform:scale(.7)}55%{opacity:1;transform:scale(1)}72%{transform:scale(.86)}88%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes sumir{to{opacity:0;transform:scale(.6)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flex{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg) scale(1.05)}60%{transform:rotate(5deg)}}

/* Compartilhar check-in */
.sh{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;justify-content:flex-end}
.sh-fundo{position:absolute;inset:0;background:rgba(10,6,6,.55);opacity:0;transition:opacity .25s}
.sh.on .sh-fundo{opacity:1}
.sh-painel{position:relative;max-height:96vh;overflow-y:auto;background:color-mix(in srgb,var(--accent) 22%,#16090b);border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);max-width:680px;width:100%;margin:0 auto}
.sh.on .sh-painel{transform:none}
.sh-alca{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.85);margin:10px auto 0}
.sh-x{position:absolute;top:14px;right:16px;width:40px;height:40px;border:none;background:none;color:#fff;font-size:24px}
.sh-car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:46px 17% 10px;scrollbar-width:none}
.sh-car::-webkit-scrollbar{display:none}
.sh-slide{flex:0 0 100%;margin:0;scroll-snap-align:center;cursor:pointer}
.sh-slide canvas{width:100%;height:auto;display:block}
.sh-slide[data-m=foto]{display:flex;justify-content:center;align-items:center}
.sh-slide[data-m=foto] canvas{width:74.25%;height:auto;border-radius:14px}
.sh-dots{display:flex;justify-content:center;gap:9px;padding:8px 0 18px}
.sh-dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .2s}
.sh-dots i.on{background:#fff}
.sh-base{background:var(--card);color:var(--text);padding:20px 18px calc(22px + env(safe-area-inset-bottom));position:relative}
.sh-base h3{margin:0 0 14px;font-size:19px}
.sh-alvos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

<script>
/* ---------- Dados ---------- */
const KEY = 'ritmo.v2';
const EX = Object.fromEntries(Exercicios.lista.map(e => [e.id, e]));
const uid = () => Math.random().toString(36).slice(2, 9);
const it = (ex, reps, series = 3, descanso = 60) => ({ ex, series, reps, descanso });
const novoPlanoVazio = i => ({ id: uid(), nome: 'Treino ' + letra(i), itens: [] });
function ensure5(){ while (S.planos.length < 5) S.planos.push(novoPlanoVazio(S.planos.length)); }
const defaultState = () => ({ nome: '', perfil: null, planos: [], checkins: [], sessoes: [], pesos: [], ativo: null });
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.planos) return s; }catch{} return defaultState(); }
let S = load();
// Exercícios removidos da biblioteca saem dos treinos salvos.
S.planos.forEach(p => { p.itens = p.itens.filter(i => EX[i.ex]); });
if (S.ativo) S.ativo.itens = S.ativo.itens.filter(i => EX[i.ex]);
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch{} }

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = () => iso(new Date());
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtData = s => fromIso(s).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const plano = id => S.planos.find(p => p.id === id);
const letra = i => String.fromCharCode(65 + i);
ensure5();

function checkin(dia = hoje()){
  if (S.checkins.includes(dia)) return false;
  S.checkins.push(dia); S.checkins.sort();
  if (dia === hoje()) { S.horas = S.horas || {}; const n = new Date(); S.horas[dia] = `${pad(n.getHours())}:${pad(n.getMinutes())}`; }
  return true;
}
const segunda = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
function semanasSeguidas(){
  const sem = new Set(S.checkins.map(c => iso(segunda(fromIso(c))))); let n = 0; const d = segunda(new Date());
  if (!sem.has(iso(d))) d.setDate(d.getDate() - 7);
  while (sem.has(iso(d))) { n++; d.setDate(d.getDate() - 7); }
  return n;
}
function recordeDias(){
  let best = 0, cur = 0, prev = null;
  S.checkins.forEach(c => { const d = fromIso(c); cur = prev && (d - prev) / 864e5 === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; });
  return best;
}
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
function streakDias(){
  const set = new Set(S.checkins); let n = 0; const d = new Date();
  if (!set.has(iso(d))) d.setDate(d.getDate() - 1);
  while (set.has(iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function semanaAtual(){
  const d = new Date(); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow);
  return Array.from({ length: 7 }, (_, i) => { const x = new Date(d); x.setDate(d.getDate() + i); return iso(x); });
}
function ultimaCarga(exId){
  for (let i = S.sessoes.length - 1; i >= 0; i--) {
    const it = S.sessoes[i].itens.find(x => x.ex === exId && x.carga !== '' && x.carga != null);
    if (it) return it.carga;
  }
  return '';
}
function proximoPlano(){
  if (!S.planos.length) return null;
  const ult = S.sessoes[S.sessoes.length - 1];
  const i = ult ? S.planos.findIndex(p => p.id === ult.plano) : -1;
  return S.planos[(i + 1) % S.planos.length];
}

/* ---------- Temas de cores ---------- */
const TEMAS = [
  { id: 'allblack', nome: 'All Black', p: '#ffffff', s: '#3a3a3a', pd: '#ffffff', black: true },
  { id: 'coral', nome: 'Coral', p: '#e8573f', s: '#ffb4a2', pd: '#ff7a5f' },
  { id: 'laranja', nome: 'Laranja Energia', p: '#ea580c', s: '#fdba74', pd: '#fb923c' },
  { id: 'vermelho', nome: 'Vermelho Fogo', p: '#dc2626', s: '#fca5a5', pd: '#f87171' },
  { id: 'rosa', nome: 'Rosa Chiclete', p: '#db2777', s: '#f9a8d4', pd: '#f472b6' },
  { id: 'orquidea', nome: 'Orquídea', p: '#c026d3', s: '#f0abfc', pd: '#e879f9' },
  { id: 'lavanda', nome: 'Lavanda', p: '#7c3aed', s: '#c4b5fd', pd: '#a78bfa' },
  { id: 'oceano', nome: 'Azul Oceano', p: '#2563eb', s: '#93c5fd', pd: '#60a5fa' },
  { id: 'marinho', nome: 'Marinho e Amarelo', p: '#1e40af', s: '#fbbf24', pd: '#60a5fa' },
  { id: 'turquesa', nome: 'Turquesa', p: '#0d9488', s: '#5eead4', pd: '#2dd4bf' },
  { id: 'verde', nome: 'Verde Musgo', p: '#15803d', s: '#a3e635', pd: '#4ade80' },
  { id: 'grena', nome: 'Grená e Azul', p: '#a50044', s: '#004d98', pd: '#b8155a', sd: '#1f6fd1', listra: true, duo: true },
  { id: 'celeste', nome: 'Celeste e Dourado', p: '#3c7fc2', s: '#f6b40e', pd: '#75aadb', listra: '#ffffff' }
];
function aplicarTema(id){
  const t = TEMAS.find(x => x.id === id) || TEMAS.find(x => x.id === 'coral'), m = (c, q, b) => `color-mix(in srgb, ${c} ${q}%, ${b})`;
  $('#temaCss').textContent = t.id === 'coral' ? '' : `
:root{--accent:${t.p};--accent-2:${t.s};--db:${t.p};--bg:${m(t.p, 4, '#ffffff')};--soft:${m(t.p, 10, '#ffffff')};--line:${m(t.p, 16, '#ececec')};--mat:${m(t.s, 45, '#ffffff')}}
@media (prefers-color-scheme: dark){:root{--accent:${t.pd};--accent-2:${t.sd || m(t.s, 45, '#151515')};--db:${t.pd};--bg:${m(t.pd, 5, '#121212')};--card:${m(t.pd, 7, '#1b1b1b')};--soft:${m(t.pd, 13, '#1d1d1d')};--line:${m(t.pd, 20, '#2b2b2b')};--mat:${m(t.pd, 30, '#222222')}}}`;
  if (t.black) $('#temaCss').textContent = `
:root,:root:not(#x){--bg:#000;--card:#0b0b0b;--soft:#161616;--line:#262626;--text:#f5f5f5;--muted:#8f8f8f;--accent:#ffffff;--accent-2:#3a3a3a;--on-accent:#000;--ok:#e6e6e6;
  --fig:#f5f5f5;--fig-far:#555;--mat:#1c1c1c;--db:#ffffff;--mq:#4a4a4a;--shadow:none;--share:#0a0a0a;color-scheme:dark}
.hd-logo .mascote,.ci-masc,.cel-mini,.cel-masc,svg.pf-av{background:#1a1a1a!important;box-shadow:inset 0 0 0 2px #333}
.mascote .m-faixa{fill:#000}.mascote .m-boch{fill:#3a3a3a}
.ci-badge{background:#fff;color:#000}
.tip.ok .tip-ic{background:#fff;color:#000}
.cel{background:#000}.cel-blob{fill:#161616}
.cel-final{background:#000!important}
.cel-btn{background:#fff;color:#000}.cel-btn.sec{background:#1c1c1c;color:#fff}.cel-btn.foto{background:#1c1c1c;color:#fff;box-shadow:inset 0 0 0 1px #333}
.cel-card{background:#111;color:#f5f5f5}.cel-card .muted,.cel-linha{color:#9a9a9a}
.progress i{background:#fff}
.tema-cor{box-shadow:inset 0 0 0 2px #444}
img.gif{filter:none}
.anim:has(img.gif),.mini:has(img.gif){background:#fff}`;
  if (t.listra) {
    const l2 = t.listra === true ? 'var(--accent-2)' : t.listra;
    $('#temaCss').textContent += `
.hd-logo .mascote,.ci-masc,.cel-mini,.cel-masc{background:repeating-linear-gradient(90deg,var(--accent) 0 9px,${l2} 9px 18px)}
.ci-card{padding-top:22px}
.ci-card::before{content:'';position:absolute;top:0;left:0;right:0;height:7px;background:repeating-linear-gradient(90deg,var(--accent) 0 22px,${l2} 22px 44px)}
.cel-final{background:repeating-linear-gradient(90deg,var(--accent) 0 48px,color-mix(in srgb,${l2} 85%,var(--accent)) 48px 96px)}
.cel-tit,.cel-num,.cel-marca{text-shadow:0 2px 8px rgba(0,0,0,.35)}
.day.on i,.cal button.on{background:linear-gradient(135deg,var(--accent) 50%,${t.listra === true ? 'var(--accent-2)' : t.s} 50%);border-color:var(--accent)}
${t.duo ? `.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));border:none;color:#fff}
.progress i,.num,.tag,.plus,.coach-ic{color:#fff}
:root{--on-accent:#fff}` : ''}`;
  }
  requestAnimationFrame(() => {
    const bg = getComputedStyle(document.body).backgroundColor;
    document.querySelectorAll('meta[name=theme-color]').forEach(x => x.setAttribute('content', bg));
  });
}
function escolherTema(id){ S.tema = id; save(); aplicarTema(id); const y = scrollY; render(); scrollTo(0, y); toast(`Tema ${TEMAS.find(t => t.id === id).nome} aplicado`); }
function temasHtml(){
  const atual = S.tema || 'coral';
  return `<div class="temas">${TEMAS.map(t => `
    <button class="tema ${t.id === atual ? 'on' : ''}" onclick="escolherTema('${t.id}')" aria-pressed="${t.id === atual}" aria-label="Tema ${t.nome}">
      <span class="tema-cor" style="--p:${t.p};--s:${t.s}"></span><span class="tema-nome">${t.nome}</span>${t.id === atual ? '<span class="tema-ok" aria-hidden="true">✓</span>' : ''}</button>`).join('')}</div>`;
}

/* ---------- Fotos (ficam só no aparelho) ---------- */
let _db;
function db(){
  return _db ||= new Promise((ok, erro) => {
    const r = indexedDB.open('musculito', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fotos');
    r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error);
  });
}
async function fotoOp(modo, fn){ const d = await db(); return new Promise((ok, erro) => { const t = d.transaction('fotos', modo); const r = fn(t.objectStore('fotos')); t.oncomplete = () => ok(r?.result); t.onerror = () => erro(t.error); }); }
const fotoPut = (k, v) => fotoOp('readwrite', st => st.put(v, k));
const fotoGet = k => fotoOp('readonly', st => st.get(k));
const fotoDel = k => fotoOp('readwrite', st => st.delete(k));
async function fotoTodas(){ const d = await db(); return new Promise(ok => { const out = {}; const r = d.transaction('fotos').objectStore('fotos').openCursor(); r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else ok(out); }; r.onerror = () => ok(out); }); }
async function reduzir(file, max, q = .82){
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { src = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function escolherImagem(camera){
  return new Promise(ok => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
    if (camera) i.setAttribute('capture', camera);
    i.onchange = () => ok(i.files[0] || null); i.click();
  });
}
async function quadrado(file, lado = 320){

  c.fillStyle = '#fff'; c.font = `600 ${44 * u}px Inter`; c.fillText(cabe(c, D.nome, W - 2 * px - av - 30 * u), px + av + 30 * u, by - 52 * u);
  c.font = `500 ${38 * u}px Inter`; c.fillText(cabe(c, /^0 /.test(D.seq) ? D.treino : `${D.treino} · ${D.seq}`, W - 2 * px - av - 30 * u), px + av + 30 * u, by + 2 * u);
  c.font = `700 ${Math.min(190 * u, H * .1)}px Fraunces`; c.fillText('Tá pago!', px - 6 * u, by - av - 50 * u);

}

async function compartilharCheckin(info = {}){
  if (document.querySelector('.sh')) return;
  const el = document.createElement('div');
  el.className = 'sh'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Compartilhar check-in');

    <div class="sh-dots">${MODELOS.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>

      <div class="sh-sub" hidden></div>
      <div class="sh-alvos">
        <button data-d="ig"><span class="sh-ic ig">${ICONES.ig}</span>Instagram</button>
        <button data-d="wa"><span class="sh-ic wa">${ICONES.wa}</span>WhatsApp</button>
        <button data-d="copiar"><span class="sh-ic cp">${ICONES.copiar}</span>Copiar</button>
        <button data-d="mais"><span class="sh-ic mais">${ICONES.mais}</span>Mais</button>
      </div></div></div>`;
  document.body.append(el);
  requestAnimationFrame(() => el.classList.add('on'));
  const fechar = () => { el.classList.remove('on'); setTimeout(() => el.remove(), 280); document.removeEventListener('keydown', tecla); };
  const tecla = e => { if (e.key === 'Escape') fechar(); };
  document.addEventListener('keydown', tecla);
  el.querySelector('.sh-x').onclick = fechar; el.querySelector('.sh-fundo').onclick = fechar;

  const D = await dadosShare(info);
  const car = el.querySelector('.sh-car'), slides = [...el.querySelectorAll('.sh-slide')];
  const pintar = () => slides.forEach(f => desenhar(f.querySelector('canvas'), f.dataset.m, D, true));
  pintar();
  let atual = 0, cache = {};
  const modelo = () => MODELOS[atual];
  // Gera os arquivos antes do toque, porque o compartilhamento precisa acontecer logo após o clique.
  const preparar = tams => tams.forEach(t => {
    const k = modelo() + t; if (cache[k]) return;
    cache[k] = new Promise(ok => { const cv = document.createElement('canvas'); [cv.width, cv.height] = TAM[t]; desenhar(cv, modelo(), D); cv.toBlob(b => ok(new File([b], `musculito-checkin-${hoje()}.png`, { type: 'image/png' })), 'image/png'); });
    cache[k].then(f => { cache[k].pronto = f; });
  });
  preparar(['story', 'post', 'msg']);
  car.addEventListener('scroll', () => {
    const i = Math.round(car.scrollLeft / slides[0].offsetWidth);
    if (i !== atual && slides[i]) { atual = i; el.querySelectorAll('.sh-dots i').forEach((d, j) => d.classList.toggle('on', j === i)); preparar(['story', 'post', 'msg']); }
  }, { passive: true });
  car.onclick = async e => {
    const f = e.target.closest('.sh-slide'); if (!f || f.dataset.m !== 'foto') return;
    origemFoto(D.foto ? 'Trocar a foto do card' : 'Foto para o card', async cam => {
      let url = null;
      if (D.sessao != null) url = await fotoDoTreino(D.sessao, cam);
      else { const arq = await escolherImagem(cam); if (arq) url = await reduzir(arq, 1920, .85).catch(() => null); }
      if (!url) return;
      D.foto = await imgDe(url); cache = {}; pintar(); preparar(['story', 'post', 'msg']); toast('Foto adicionada ao card');
    });
  };

  const texto = `💪 Check-in feito no Musculito! ${D.treino}. ${D.seq}.`;
  const enviar = async (tam, dica, comTexto) => {
    if (modelo() === 'foto' && !D.foto) return toast('Toque no card para adicionar sua foto');
    preparar([tam]);
    const arq = cache[modelo() + tam].pronto || await cache[modelo() + tam];
    const dados = { files: [arq], ...(comTexto ? { text: texto } : {}) };
    if (navigator.canShare?.(dados)) {
      if (dica) toast(dica);
      try { await navigator.share(dados); } catch (err) { if (err.name !== 'AbortError') toast('Não foi possível abrir o compartilhamento.'); }
      return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(arq); a.download = arq.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Imagem salva. Abra o app e publique a partir da galeria.');
  };
  const sub = el.querySelector('.sh-sub');
  el.querySelector('.sh-alvos').onclick = async e => {
    const b = e.target.closest('[data-d]'); if (!b) return;
    const d = b.dataset.d;
    if (DESTINOS[d]) {
      const aberto = b.classList.contains('on');
      el.querySelectorAll('.sh-alvos button').forEach(x => x.classList.remove('on'));
      if (aberto) { sub.hidden = true; return; }
      b.classList.add('on');
      const bx = b.offsetLeft + b.offsetWidth / 2;
      sub.innerHTML = DESTINOS[d].ops.map(([t, nome, dica], i) => `<button class="sh-op ${d}" data-t="${t}" data-dica="${esc(dica)}" style="--i:${i};--de:${bx}px">${nome}</button>`).join('');
      sub.hidden = false; sub.classList.remove('boom');
      sub.querySelectorAll('.sh-op').forEach(o => { o.style.setProperty('--dx', `${bx - (o.offsetLeft + o.offsetWidth / 2)}px`); });
      void sub.offsetWidth; sub.classList.add('boom');
      sub.onclick = ev => { const o = ev.target.closest('.sh-op'); if (o) enviar(o.dataset.t, o.dataset.dica, false); };
      return;
    }
    sub.hidden = true; el.querySelectorAll('.sh-alvos button').forEach(x => x.classList.remove('on'));
    if (d === 'mais') return enviar('post', '', true);
    if (d === 'copiar') {
      try { preparar(['post']); const arq = cache[modelo() + 'post'].pronto || await cache[modelo() + 'post']; await navigator.clipboard.write([new ClipboardItem({ 'image/png': arq })]); toast('Imagem copiada'); }
      catch { try { await navigator.clipboard.writeText(texto + ' ' + location.href.split('?')[0]); toast('Texto copiado'); } catch { toast(texto); } }
    }
  };
}

/* Junta as mudanças do treino (exercícios novos, séries, ordem) com o que já foi feito, sem zerar nada. */
function sincronizarAtivo(){
  const a = S.ativo, p = a && plano(a.plano); if (!p) return;
  const sobra = [...a.itens], usados = new Set();
  const novos = p.itens.map(it => {
    const k = sobra.findIndex((x, j) => !usados.has(j) && x.ex === it.ex);
    const n = Math.max(1, +it.series || 1);
    if (k < 0) return { ...it, carga: ultimaCarga(it.ex), feitas: Array(n).fill(false) };
    usados.add(k); const old = sobra[k];
    const feitas = old.feitas.slice(0, n); while (feitas.length < n) feitas.push(false);
    return { ...it, carga: old.carga, feitas };
  });
  // exercícios já feitos que saíram do treino continuam no registro de hoje
  sobra.forEach((x, j) => { if (!usados.has(j) && x.feitas.some(Boolean)) novos.push(x); });
  a.itens = novos; save();
}
function continuarTreino(){ sincronizarAtivo(); view = 'treino'; render(); scrollTo(0, 0); }

/* Timer de descanso */
let tInt = null;
function iniciarTimer(seg){
  pararTimer(); const fim = Date.now() + seg * 1000, el = $('#timer'); el.hidden = false; document.body.classList.add('has-timer');
  const tick = () => {
    const r = Math.max(0, Math.ceil((fim - Date.now()) / 1000));
    el.innerHTML = `<span class="small">Descanso</span><b>${Math.floor(r / 60)}:${pad(r % 60)}</b><div class="bar"><i style="width:${r / seg * 100}%"></i></div><button>+15s</button><button onclick="pararTimer()">Pular</button>`;
    el.querySelector('button').onclick = () => { const left = Math.max(0, Math.ceil((fim - Date.now()) / 1000)); iniciarTimer(left + 15); };
    if (r <= 0) { pararTimer(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); bip(); }
  };
  tick(); tInt = setInterval(tick, 250);
}
function pararTimer(){ clearInterval(tInt); tInt = null; $('#timer').hidden = true; document.body.classList.remove('has-timer'); }

  d.els.forEach(el => el.style.transform = ''); d.item.classList.remove('dragging'); d.list.classList.remove('sorting');
  if (d.from !== d.to) { if (navigator.vibrate) navigator.vibrate(10); d.list._onMove(d.from, d.to); }
}
function pointerMove(x, y, e){
  if (DRAG) { if (e.cancelable) e.preventDefault(); DRAG.y = y; return; }
  if (PRESS && (Math.abs(x - PRESS.x) > 8 || Math.abs(y - PRESS.y) > 8)) { clearTimeout(PRESS.timer); PRESS = null; }
}
function pointerEnd(){ if (PRESS) { clearTimeout(PRESS.timer); PRESS = null; } if (DRAG) endDrag(); }
document.addEventListener('touchmove', e => pointerMove(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
document.addEventListener('touchend', pointerEnd);
document.addEventListener('touchcancel', pointerEnd);
document.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY, e));
document.addEventListener('mouseup', pointerEnd);
document.addEventListener('click', e => { if (Date.now() - lastDrag < 400) { e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', e => { if (DRAG || PRESS) e.preventDefault(); });

/* Aviso rápido */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

/* Evolução */
function lineChart(pts, unidade){
  if (pts.length < 2) return `<p class="muted small">${pts.length ? 'Registre mais uma vez para ver o gráfico.' : 'Sem registros ainda.'}</p>`;
  const W = 320, H = 150, L = 34, R = 10, T = 12, B = 24;
  const ys = pts.map(p => p.y), min = Math.min(...ys), max = Math.max(...ys), span = (max - min) || 1;
  const lo = min - span * .15, hi = max + span * .15;
  const x = i => L + i * (W - L - R) / (pts.length - 1), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const ticks = [lo + (hi - lo) * .15, (lo + hi) / 2, hi - (hi - lo) * .15];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução">
    ${ticks.map(t => `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${+t.toFixed(1)}</text>`).join('')}
    <path class="ln" d="${d}"/>${pts.map((p, i) => `<circle class="dot" cx="${x(i)}" cy="${y(p.y)}" r="3.5"><title>${fmtData(p.x)}: ${p.y} ${unidade}</title></circle>`).join('')}
    <text x="${L}" y="${H - 6}">${fmtData(pts[0].x)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtData(pts[pts.length - 1].x)}</text></svg>`;
}
let calMes = new Date(); calMes.setDate(1);
function vEvolucao(){
  const set = new Set(S.checkins), y = calMes.getFullYear(), m = calMes.getMonth();
  const first = (new Date(y, m, 1).getDay() + 6) % 7, dias = new Date(y, m + 1, 0).getDate(), h = hoje();
  const noMes = S.checkins.filter(d => d.startsWith(`${y}-${pad(m + 1)}`)).length;
  const exUsados = [...new Set(S.sessoes.flatMap(s => s.itens.filter(i => i.carga !== '' && i.carga != null).map(i => i.ex)))].filter(id => EX[id]);
  if (!evoEx || !exUsados.includes(evoEx)) evoEx = exUsados[0] || null;
  const cargas = evoEx ? S.sessoes.map(s => ({ x: s.data, it: s.itens.find(i => i.ex === evoEx) })).filter(o => o.it && o.it.carga !== '' && o.it.carga != null).map(o => ({ x: o.x, y: +o.it.carga })) : [];
  const pesos = [...S.pesos].sort((a, b) => a.data.localeCompare(b.data)).map(p => ({ x: p.data, y: p.kg }));
  const ultimas = S.sessoes.slice(-5).reverse();
  return `
    <div class="top"><h1>Evolução</h1></div>
    <div class="stack">
      <section class="card">
        <div class="row" style="justify-content:space-between">
          <button class="icon-btn" onclick="mudaMes(-1)" aria-label="Mês anterior">‹</button>
          <div style="text-align:center"><h3 style="text-transform:capitalize">${MESES[m]} ${y}</h3><span class="small muted">${noMes} check-in${noMes === 1 ? '' : 's'}</span></div>
          <button class="icon-btn" onclick="mudaMes(1)" aria-label="Próximo mês">›</button>
        </div>
        <div class="cal">${['S','T','Q','Q','S','S','D'].map(d => `<span>${d}</span>`).join('')}
          ${Array(first).fill('<i class="empty"></i>').join('')}
          ${Array.from({ length: dias }, (_, i) => { const d = `${y}-${pad(m + 1)}-${pad(i + 1)}`; return d > h ? `<i class="futuro">${i + 1}</i>` : `<button class="${set.has(d) ? 'on' : ''} ${d === h ? 'today' : ''}" onclick="marcarDia('${d}')" aria-pressed="${set.has(d)}" aria-label="${i + 1} de ${MESES[m]}">${i + 1}</button>`; }).join('')}
        </div>
        <div class="streak" style="margin-top:14px">
          <div class="stat"><b>${S.checkins.length}</b><span class="small muted">check-ins no total</span></div>
          <div class="stat"><b>${S.sessoes.length}</b><span class="small muted">treinos concluídos</span></div>
        </div>
      </section>
      <section class="card">
        <h3>Carga por exercício</h3>
        ${exUsados.length ? `<select style="margin-top:10px" onchange="evoEx=this.value;render()" aria-label="Exercício">${exUsados.map(id => `<option value="${id}" ${id === evoEx ? 'selected' : ''}>${esc(EX[id]?.nome || id)}</option>`).join('')}</select>${lineChart(cargas, 'kg')}`
          : '<p class="muted small">Registre a carga durante os treinos para acompanhar a evolução.</p>'}
      </section>
      <section class="card">
        <h3>Peso corporal</h3>
        <div class="row" style="margin-top:10px">
          <input type="number" inputmode="decimal" step="0.1" id="pesoIn" placeholder="kg" aria-label="Peso em kg">
          <input type="date" id="pesoData" value="${h}" aria-label="Data">
          <button class="btn primary" onclick="addPeso()">Salvar</button>
        </div>
        ${lineChart(pesos, 'kg')}
      </section>
      <section class="card">
        <h3>Últimos treinos</h3>
        ${ultimas.length ? ultimas.map(s => { const idx = S.sessoes.indexOf(s); return `<div class="list-item">${s.foto ? `<button class="thumb" data-foto="${s.foto}" onclick="verFoto(${idx})" aria-label="Ver foto"></button>` : ''}<div class="grow"><b>${esc(s.nome)}</b><span class="small muted">${fmtData(s.data)} · ${fmtMin(s.minutos)} · ${s.itens.reduce((a, i) => a + i.series, 0)} séries</span></div><button class="btn sm" onclick="editarSessao(${idx})" aria-label="Editar duração de ${esc(s.nome)} em ${fmtData(s.data)}">Editar</button></div>`; }).join('') : '<p class="muted small">Nenhum treino concluído ainda.</p>'}
      </section>
      <section class="card">
        <h3>Fotos dos treinos</h3>
        ${S.sessoes.some(x => x.foto) ? `<div class="galeria">${S.sessoes.map((x, i) => x.foto ? `<button class="gal-item" data-foto="${x.foto}" onclick="verFoto(${i})" aria-label="Foto de ${fmtData(x.data)}"><span>${fmtData(x.data)}</span></button>` : '').reverse().join('')}</div>`
          : '<p class="muted small">Ao finalizar um treino, tire uma foto ou escolha uma da galeria. As fotos aparecem aqui para você ver sua evolução.</p>'}
      </section>
    </div>`;
}
const fmtMin = m => !m ? 'duração não registrada' : m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${m % 60 ? ' ' + pad(m % 60) + 'min' : ''}`;
function editarSessao(i){
  const s = S.sessoes[i]; if (!s) return;
  abrirDlg(`<div class="dlg"><div class="dlg-head"><h2>Duração do treino</h2><button class="icon-btn" onclick="fecharDlg()" aria-label="Fechar">✕</button></div>
    <p class="muted small" style="margin-top:0">${esc(s.nome)} · ${fmtData(s.data)}</p>
    <div class="row"><label class="grow small muted">Horas<input type="number" id="durH" min="0" max="6" inputmode="numeric" value="${Math.floor(s.minutos / 60)}"></label>
      <label class="grow small muted">Minutos<input type="number" id="durM" min="0" max="59" inputmode="numeric" value="${s.minutos % 60}"></label></div>
    <button class="btn primary block" style="margin-top:14px" onclick="salvarDuracao(${i})">Salvar</button>
    <button class="btn block" style="margin-top:8px" onclick="${s.foto ? `fecharDlg();verFoto(${i})` : `addFotoSessao(${i})`}">${s.foto ? 'Ver foto do treino' : '📷 Adicionar foto a este treino'}</button></div>`);
}
function salvarDuracao(i){
  const m = Math.max(0, parseInt($('#durH').value) || 0) * 60 + Math.max(0, Math.min(59, parseInt($('#durM').value) || 0));
  if (!m) return $('#durM').focus();
  S.sessoes[i].minutos = m; save(); fecharDlg(); render(); toast(`Duração atualizada: ${fmtMin(m)}`);
}
function mudaMes(d){ calMes.setMonth(calMes.getMonth() + d); render(); }
function addPeso(){
  const kg = parseFloat($('#pesoIn').value.replace(',', '.')), data = $('#pesoData').value || hoje();
  if (!kg) return $('#pesoIn').focus();
  S.pesos = S.pesos.filter(p => p.data !== data); S.pesos.push({ data, kg }); save(); render();
}

/* Ajustes */
function vAjustes(){
  return `
    <div class="top"><h1>Ajustes</h1></div>
    <div class="stack">
      <section class="card stack">
        <h3>Tema de cores</h3>

        ${temasHtml()}
      </section>
      <section class="card stack">
        <h3>Seu perfil</h3>
        ${perfilForm()}
        <button class="btn primary" onclick="salvarPerfil(false)">Salvar perfil</button>
      </section>

        <h3>Estatísticas de uso</h3>
        <p class="muted small" style="margin:0">Para melhorar o app, contamos de forma anônima quais telas e botões são usados (por exemplo, "check-in feito"). Não enviamos nome, peso, fotos nem treinos.</p>
        <label class="opt"><input type="checkbox" ${S.semMetricas ? '' : 'checked'} onchange="alternarMetricas(this.checked)"><span>Enviar estatísticas anônimas</span></label>
      </section>

        <button class="btn" onclick="exportar()">Baixar backup</button>
        <label class="btn" style="text-align:center">Restaurar backup<input type="file" accept="application/json,.json" hidden onchange="importar(this.files[0])"></label>
      </section>

        <h3>Instalar no celular</h3>
        <p class="muted small" style="margin:0">iPhone: no Safari, toque em Compartilhar → <b>Adicionar à Tela de Início</b>.<br>Android: no Chrome, toque em ⋮ → <b>Instalar app</b>.</p>
      </section>
      <button class="btn ghost" style="color:var(--accent)" onclick="zerar()">Apagar todos os dados</button>
      <p class="muted small" style="text-align:center">As animações são ilustrativas (animações 3D © <a href="https://gymvisual.com/" target="_blank" rel="noopener">Gym visual</a>, via ExerciseDB). Para montar ou ajustar seu treino, conte com um profissional de educação física.</p>
    </div>`;
}
async function exportar(){
  const fotos = await fotoTodas().catch(() => ({}));
  const b = new Blob([JSON.stringify({ ...S, fotos }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `musculito-backup-${hoje()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importar(f){
  if (!f) return;
  try{ const d = JSON.parse(await f.text()); if (!d.planos) throw 0; if (!confirm('Substituir os dados atuais pelo backup?')) return; const { fotos, ...dados } = d; S = { ...defaultState(), ...dados }; save(); aplicarTema(S.tema);
    if (fotos) for (const [k, v] of Object.entries(fotos)) await fotoPut(k, v).catch(() => {}); view = 'hoje'; render(); alert('Backup restaurado.'); }
  catch{ alert('Esse arquivo não parece um backup do Musculito.'); }
}
function zerar(){ if (!confirm('Apagar todos os treinos, check-ins e registros?')) return; S = defaultState(); save(); aplicarTema(); view = 'hoje'; render(); }

function fecharDlg(){ $('#dlg').close(); }
$('#dlg').addEventListener('close', () => { if (!$('#dlg').open) $('#dlgBody').innerHTML = ''; });
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) fecharDlg(); });

aplicarTema(S.tema);
instrumentar(); carregarMetricas();
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const tinha = !!navigator.serviceWorker.controller; let recarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (tinha && !recarregou && !S.ativo) { recarregou = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
}
