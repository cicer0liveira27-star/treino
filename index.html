<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16110f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Ritmo: seus treinos com check-in, evolução e animações de cada exercício.">
<title>Ritmo · Treinos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7f2; --card:#ffffff; --soft:#fbe9e0; --line:#f0dcd2;
  --text:#2a1f1b; --muted:#8c7a72; --accent:#e8573f; --accent-2:#ffb4a2; --ok:#2f9e6d;
  --fig:#2a1f1b; --fig-far:#c9b4aa; --mat:#ffd9cc; --db:#e8573f; --mq:#9fb0ba;
  --shadow:0 1px 2px rgba(60,30,20,.06),0 6px 20px rgba(60,30,20,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16110f; --card:#211a17; --soft:#2c221e; --line:#3a2e29;
    --text:#f6ece7; --muted:#a8968e; --accent:#ff7a5f; --accent-2:#7a3a2c; --ok:#4cc38a;
    --fig:#f6ece7; --fig-far:#6e5a52; --mat:#4a2f27; --db:#ff7a5f; --mq:#5d6d76; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 Inter,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:28px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.block{width:100%;padding:14px}
.btn.sm{padding:6px 12px;font-size:14px}
.icon-btn{border:none;background:var(--soft);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px}
input[type=text],input[type=number],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}

/* Hoje */
.hello{font-size:15px;color:var(--muted)}
.streak{display:flex;gap:12px}
.stat{flex:1;background:var(--soft);border-radius:14px;padding:12px}
.stat b{display:block;font-family:Fraunces,serif;font-size:26px;line-height:1.1}
.week{display:flex;justify-content:space-between;margin-top:14px}
.day{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted)}
.day i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px}
.day.on i{background:var(--accent);border-color:var(--accent);color:#fff}
.day.today{color:var(--text);font-weight:600}
.plan{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.plan .badge{width:52px;height:52px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-family:Fraunces,serif;font-size:24px;font-weight:700;color:var(--accent);flex:none}
.plan .meta{flex:1;min-width:0}
.plan .meta b{display:block}
.tag{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:2px 8px;font-weight:600;vertical-align:middle;margin-left:6px}

/* Treino em andamento */
.ex{padding:0;overflow:hidden}
.ex .anim{background:var(--soft);aspect-ratio:240/218;max-height:260px;width:100%;display:grid;place-items:center}
.ex .anim svg{width:100%;height:100%;max-height:260px}
.ex .body{padding:14px 16px 16px}
.ex .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex.done .anim{opacity:.55}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.set{min-width:56px;padding:10px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:600;text-align:center}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.load{display:flex;align-items:center;gap:8px;margin-top:12px}
.load input{width:92px;text-align:center}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500}
details ul{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* Figura */
.fig .limb,.fig .torso{stroke:var(--fig);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .torso{stroke-width:13}
.fig-far .limb{stroke:var(--fig-far)}
.fig .head{fill:var(--fig)}
.fig-ground{stroke:var(--line);stroke-width:2}
.fig-mat{fill:var(--mat)}
.db rect,.dbc{fill:var(--db)}
.fig .mq{stroke:var(--mq);stroke-linecap:round;fill:none}
.fig .mqf{fill:var(--mq)}
.fig .mqb{fill:var(--mq);opacity:.3}
.fig .cabo{stroke:var(--muted);stroke-width:1.5;fill:none}
.fig .plate{fill:none;stroke:var(--mq);stroke-width:4}
.fig .pad{stroke:var(--mq);stroke-width:9;stroke-linecap:round;opacity:.85}

.timer[hidden]{display:none}
.has-timer{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
/* Timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(640px,calc(100% - 24px));background:var(--text);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.timer b{font-family:Fraunces,serif;font-size:26px;min-width:64px}
.timer .bar{flex:1;height:6px;background:rgba(127,127,127,.35);border-radius:99px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent)}
.timer button{background:transparent;border:1px solid currentColor;border-radius:999px;padding:6px 12px;font-size:14px}

/* Navegação inferior */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs div{display:flex;max-width:680px;width:100%}
nav.tabs button{flex:1;background:none;border:none;display:grid;justify-items:center;gap:2px;padding:8px 0;font-size:12px;color:var(--muted);border-radius:12px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:600}

/* Evolução */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:12px}
.cal span{font-size:11px;color:var(--muted)}
.cal i{font-style:normal;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;background:var(--soft)}
.cal i.on{background:var(--accent);color:#fff;font-weight:600}
.cal i.empty{background:transparent}
.cal i.today{outline:2px solid var(--accent);outline-offset:-2px}
.chart{width:100%;height:auto;margin-top:10px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent)}
.chart .ax{stroke:var(--line)}
.chart text{fill:var(--muted);font-size:11px;font-family:Inter,sans-serif}
.row{display:flex;gap:8px;align-items:center}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:none}
.mini{width:56px;height:52px;border-radius:10px;background:var(--soft);flex:none}
.mini svg{width:100%;height:100%}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;border:none;background:none;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:14px}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:600}

dialog{border:none;border-radius:20px;padding:0;background:var(--card);color:var(--text);width:min(560px,calc(100vw - 20px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(20,10,8,.5)}
.dlg{padding:18px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lib button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 6px 10px;text-align:left;font-size:13px}
.lib .mini{width:100%;height:auto;aspect-ratio:240/218}
.lib b{display:block;font-weight:500;margin:6px 4px 0}
.lib small{color:var(--muted);margin:0 4px}
.celebrate{text-align:center;padding:28px 20px}
.celebrate .big{font-size:54px}
.empty-note{text-align:center;color:var(--muted);padding:20px}

/* Grade, busca e arrastar */
.badge{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-family:Fraunces,serif;font-size:17px;font-weight:700;color:var(--accent);flex:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{min-width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;flex:none}
.sort-item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .18s ease,box-shadow .18s}
.sort-item input{-webkit-user-select:text;user-select:text}
.sort-item.dragging{transition:box-shadow .18s;position:relative;z-index:30;box-shadow:0 16px 36px rgba(60,30,20,.25);outline:2px solid var(--accent)}
.drag{border:none;background:none;color:var(--muted);font-size:22px;line-height:1;padding:8px 4px;margin-left:-6px;cursor:grab;touch-action:none;border-radius:8px}
.libbox{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.stack{grid-template-columns:minmax(0,1fr)}
.libq{width:100%;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:12px 16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.lib button{position:relative}
.lib .have{position:absolute;top:10px;left:10px;background:var(--ok);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;z-index:1}
.lib .addlbl{display:block;color:var(--accent);font-weight:600;margin:6px 4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.modelo{display:flex;gap:10px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:14px;cursor:pointer}
.modelo:has(input:checked){border-color:var(--accent);background:var(--soft)}
.modelo input{margin-top:4px;accent-color:var(--accent)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div id="timer" class="timer" hidden></div>
<nav class="tabs" aria-label="Seções"><div id="tabs"></div></nav>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="exercicios.js"></script>
<script>
/* ---------- Dados ---------- */
const KEY = 'ritmo.v2';
const EX = Object.fromEntries(Exercicios.lista.map(e => [e.id, e]));
const uid = () => Math.random().toString(36).slice(2, 9);
const it = (ex, reps, series = 3, descanso = 60) => ({ ex, series, reps, descanso });
const AER = it('aerobico', '10 min', 1, 0);
const MODELOS = [
  { id: 'grade-ae', nome: 'Grade A–E (5 dias)', desc: 'Divisão completa em 5 treinos com aeróbico diário: posterior, costas, quadríceps, peito e ombros, pernas.', planos: [
    { id: uid(), nome: 'Posterior e glúteos', itens: [
      { ex: 'aerobico', series: 1, reps: '10 min', descanso: 0 },
      { ex: 'agachamento-sumo', series: 3, reps: '8 a 12', descanso: 60 },
      { ex: 'mesa-flexora', series: 3, reps: '8 a 12', descanso: 60 },
      { ex: 'cadeira-flexora', series: 3, reps: '8 a 10', descanso: 60 },
      { ex: 'bulgaro', series: 3, reps: '8 cada perna', descanso: 60 },
      { ex: 'coice-polia', series: 3, reps: '8 a 10 cada perna', descanso: 60 },
      { ex: 'abducao-polia', series: 3, reps: '8 a 10 cada perna', descanso: 60 },
      { ex: 'cadeira-abdutora', series: 3, reps: '10', descanso: 60 } ] },
    { id: uid(), nome: 'Costas, bíceps e abdômen', itens: [
      { ex: 'aerobico', series: 1, reps: '10 min', descanso: 0 },
      { ex: 'puxador-frente', series: 3, reps: '8 a 12', descanso: 60 },
      { ex: 'remada-sentada', series: 3, reps: '8 a 12', descanso: 60 },
      { ex: 'rosca', series: 3, reps: '10', descanso: 60 },
      { ex: 'rosca-martelo', series: 3, reps: '8 a 10', descanso: 60 },
      { ex: 'abdominal-infra', series: 3, reps: '8 a 10', descanso: 60 },
      { ex: 'abdominal-remador', series: 3, reps: '8', descanso: 60 },
      { ex: 'prancha', series: 3, reps: '30 s', descanso: 60 } ] },
    { id: uid(), nome: 'Quadríceps e panturrilha', itens: [
      { ex: 'aerobico', series: 1, reps: '10 min', descanso: 0 },
      { ex: 'agachamento-smith', series: 3, reps: '8 a 12', descanso: 60 },
      { ex: 'agachamento-isometria', series: 3, reps: '20 a 30 s', descanso: 60 },
      { ex: 'leg-press', series: 3, reps: '8 a 10', descanso: 60 },
      { ex: 'cadeira-extensora', series: 3, reps: '8 a 10', descanso: 60 },
      { ex: 'cadeira-adutora', series: 3, reps: '10', descanso: 60 },
      { ex: 'panturrilha', series: 3, reps: '10', descanso: 60 },
      { ex: 'panturrilha-sentada', series: 3, reps: '8 a 12', descanso: 60 } ] },
    { id: uid(), nome: 'Ombros, peito, tríceps e abdômen', itens: [
      { ex: 'aerobico', series: 1, reps: '10 min', descanso: 0 },
      { ex: 'peck-deck', series: 3, reps: '8 a 12', descanso: 60 },
      { ex: 'elevacao-lateral', series: 3, reps: '8 a 10', descanso: 60 },
      { ex: 'elevacao-frontal', series: 3, reps: '8 a 10', descanso: 60 },
      { ex: 'triceps-corda', series: 3, reps: '10', descanso: 60 },
      { ex: 'abdominal', series: 3, reps: '10', descanso: 60 },
      { ex: 'prancha', series: 3, reps: '30 s', descanso: 60 },
      { ex: 'abdominal-infra', series: 3, reps: '8 a 10', descanso: 60 } ] },
    { id: uid(), nome: 'Pernas e glúteos', itens: [
      { ex: 'aerobico', series: 1, reps: '10 min', descanso: 0 },
      { ex: 'cadeira-abdutora', series: 3, reps: '8', descanso: 60 },
      { ex: 'agachamento-smith', series: 3, reps: '8 a 12', descanso: 60 },
      { ex: 'agachamento-sumo', series: 3, reps: '8 a 12', descanso: 60 },
      { ex: 'agachamento-hack', series: 3, reps: '10', descanso: 60 },
      { ex: 'cadeira-extensora', series: 3, reps: '8 a 10', descanso: 60 },
      { ex: 'mesa-flexora', series: 3, reps: '8 a 10', descanso: 60 },
      { ex: 'elevacao-pelvica', series: 3, reps: '10', descanso: 60 } ] }
  ] },
  { id: 'abc', nome: 'ABC (3 dias)', desc: 'Peito, ombros e tríceps · Costas e bíceps · Pernas e glúteos.', planos: [
    { nome: 'Peito, ombros e tríceps', itens: [AER, it('supino-maquina', '8 a 12'), it('supino-inclinado', '8 a 12'), it('peck-deck', '10 a 12'), it('desenvolvimento', '8 a 10'), it('elevacao-lateral', '10 a 12'), it('triceps-corda', '10 a 12')] },
    { nome: 'Costas e bíceps', itens: [AER, it('puxador-frente', '8 a 12'), it('remada-sentada', '8 a 12'), it('remada', '10'), it('rosca', '10'), it('rosca-martelo', '10'), it('prancha', '30 s')] },
    { nome: 'Pernas e glúteos', itens: [AER, it('agachamento', '10 a 12'), it('leg-press', '10'), it('cadeira-extensora', '10 a 12'), it('mesa-flexora', '10 a 12'), it('elevacao-pelvica', '12'), it('panturrilha', '15')] }
  ] },
  { id: 'peito', nome: 'Foco em peito', desc: 'Um treino completo de peito com barra, halteres, máquina e polia.', planos: [
    { nome: 'Peito completo', itens: [AER, it('supino-reto', '8 a 12', 4), it('supino-inclinado', '8 a 12'), it('supino-maquina', '10 a 12'), it('crucifixo', '10 a 12'), it('crossover', '12 a 15'), it('peck-deck', '12'), it('pullover', '12'), it('flexao', 'até a falha')] }
  ] },
  { id: 'casa', nome: 'Em casa, sem aparelhos', desc: 'Corpo inteiro só com o peso do corpo e um colchonete.', planos: [
    { nome: 'Corpo inteiro', itens: [it('agachamento', '15'), it('afundo', '10 cada perna'), it('elevacao-pelvica', '15'), it('flexao', '8 a 12'), it('coice', '15 cada perna'), it('abdominal', '15'), it('prancha', '30 s')] }
  ] }
];
function aplicarModelo(id){
  const m = MODELOS.find(x => x.id === id); if (!m) return;
  m.planos.forEach(p => S.planos.push({ id: uid(), nome: p.nome, itens: p.itens.map(i => ({ ...i })) }));
}
const defaultState = () => ({ nome: '', planos: [], checkins: [], sessoes: [], pesos: [], ativo: null });
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.planos) return s; }catch{} return defaultState(); }
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch{} }

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = () => iso(new Date());
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtData = s => fromIso(s).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const plano = id => S.planos.find(p => p.id === id);
const letra = i => String.fromCharCode(65 + i);

function checkin(dia = hoje()){ if (!S.checkins.includes(dia)) { S.checkins.push(dia); S.checkins.sort(); } }
function streakDias(){
  const set = new Set(S.checkins); let n = 0; const d = new Date();
  if (!set.has(iso(d))) d.setDate(d.getDate() - 1);
  while (set.has(iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function semanaAtual(){
  const d = new Date(); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow);
  return Array.from({ length: 7 }, (_, i) => { const x = new Date(d); x.setDate(d.getDate() + i); return iso(x); });
}
function ultimaCarga(exId){
  for (let i = S.sessoes.length - 1; i >= 0; i--) {
    const it = S.sessoes[i].itens.find(x => x.ex === exId && x.carga !== '' && x.carga != null);
    if (it) return it.carga;
  }
  return '';
}
function proximoPlano(){
  if (!S.planos.length) return null;
  const ult = S.sessoes[S.sessoes.length - 1];
  const i = ult ? S.planos.findIndex(p => p.id === ult.plano) : -1;
  return S.planos[(i + 1) % S.planos.length];
}

/* Timer de descanso */
let tInt = null;
function iniciarTimer(seg){
  pararTimer(); const fim = Date.now() + seg * 1000, el = $('#timer'); el.hidden = false; document.body.classList.add('has-timer');
  const tick = () => {
    const r = Math.max(0, Math.ceil((fim - Date.now()) / 1000));
    el.innerHTML = `<span class="small">Descanso</span><b>${Math.floor(r / 60)}:${pad(r % 60)}</b><div class="bar"><i style="width:${r / seg * 100}%"></i></div><button>+15s</button><button onclick="pararTimer()">Pular</button>`;
    el.querySelector('button').onclick = () => { const left = Math.max(0, Math.ceil((fim - Date.now()) / 1000)); iniciarTimer(left + 15); };
    if (r <= 0) { pararTimer(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); bip(); }
  };
  tick(); tInt = setInterval(tick, 250);
}
function pararTimer(){ clearInterval(tInt); tInt = null; $('#timer').hidden = true; document.body.classList.remove('has-timer'); }
function bip(){ try{ const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(c.destination); o.start(); setTimeout(() => { o.stop(); c.close(); }, 350); }catch{} }

/* Grade completa com busca */
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const GRUPOS = ['Todos', ...new Set(Exercicios.lista.map(e => e.grupo))];
const LIB = { ver: { q: '', g: 'Todos' }, add: { q: '', g: 'Todos' } };
function filtrar(q, g){
  const ws = norm(q).split(/\s+/).filter(Boolean);
  return Exercicios.lista.filter(e => (g === 'Todos' || e.grupo === g) && ws.every(w => norm(`${e.nome} ${e.aparelho} ${e.grupo} ${e.id}`).includes(w)));
}
function libBlock(action){
  const st = LIB[action];
  return `<div class="libbox" data-action="${action}">
    <input type="search" class="libq" value="${esc(st.q)}" placeholder="Buscar exercício ou aparelho (ex.: supino, polia, voador)" aria-label="Buscar exercício ou aparelho">
    <div class="chips" role="group" aria-label="Grupos musculares">${GRUPOS.map(g => `<button class="chip ${g === st.g ? 'on' : ''}" data-g="${esc(g)}" aria-pressed="${g === st.g}">${esc(g)}</button>`).join('')}</div>
    <div class="lib libgrid"></div></div>`;
}
function bindLib(root){
  root.querySelectorAll('.libbox').forEach(box => {
    const act = box.dataset.action, st = LIB[act], q = box.querySelector('.libq'), grid = box.querySelector('.libgrid');
    const tem = act === 'add' ? new Set((plano(editId)?.itens || []).map(i => i.ex)) : new Set();
    const draw = () => {
      const list = filtrar(st.q, st.g);
      grid.innerHTML = list.length ? list.map(e => `<button data-ex="${e.id}">${tem.has(e.id) ? '<span class="have">✓ no treino</span>' : ''}<div class="mini" data-anim="${e.id}" data-still="1"></div><b>${esc(e.nome)}</b><small>${esc(e.aparelho)}</small>${act === 'add' ? '<span class="addlbl">+ Adicionar</span>' : ''}</button>`).join('')
        : `<p class="muted small" style="grid-column:1/-1;text-align:center">Nada encontrado para “${esc(st.q)}”.</p>`;
      mountAnims(grid);
    };
    q.oninput = () => { st.q = q.value; draw(); };
    box.querySelectorAll('.chip').forEach(c => c.onclick = () => { st.g = c.dataset.g; box.querySelectorAll('.chip').forEach(x => { x.classList.toggle('on', x === c); x.setAttribute('aria-pressed', x === c); }); draw(); });
    grid.onclick = e => { const b = e.target.closest('[data-ex]'); if (b) (act === 'add' ? addEx : verEx)(b.dataset.ex); };
    draw();
  });
}

/* Arrastar para reordenar (segurar e arrastar, ou alça ⠿; setas no teclado) */
let DRAG = null, PRESS = null, lastDrag = 0;
const sortItems = list => [...list.children].filter(c => c.classList.contains('sort-item'));
function sortable(list, onMove){
  if (!list) return;
  list._onMove = onMove;
  list.addEventListener('touchstart', e => { if (e.touches.length === 1) pressStart(e, list, e.touches[0]); }, { passive: true });
  list.addEventListener('mousedown', e => { if (e.button === 0) pressStart(e, list, e); });
  list.addEventListener('keydown', e => {
    const h = e.target.closest('.drag'); if (!h || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
    const els = sortItems(list), i = els.indexOf(h.closest('.sort-item')), j = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (j < 0 || j >= els.length) return;
    e.preventDefault(); const id = list.id; onMove(i, j);
    const nl = document.getElementById(id); if (nl) sortItems(nl)[j]?.querySelector('.drag')?.focus();
  });
}
function pressStart(e, list, pt){
  if (DRAG) return;
  const item = e.target.closest('.sort-item'); if (!item || item.parentElement !== list) return;
  if (e.target.closest('input,select,textarea')) return;
  if (e.target.closest('.drag')) { if (e.type === 'mousedown') e.preventDefault(); beginDrag(list, item, pt.clientY); return; }
  if (e.target.closest('button,a')) return;
  clearTimeout(PRESS?.timer);
  PRESS = { x: pt.clientX, y: pt.clientY, timer: setTimeout(() => { const p = PRESS; PRESS = null; if (p) beginDrag(list, item, p.y); }, 380) };
}
function beginDrag(list, item, y){
  const els = sortItems(list), from = els.indexOf(item); if (from < 0 || els.length < 2) return;
  const rects = els.map(el => { const r = el.getBoundingClientRect(); return { top: r.top + scrollY, h: r.height }; });
  const gap = rects[1].top - rects[0].top - rects[0].h;
  DRAG = { list, item, els, from, to: from, rects, gap, y0: y + scrollY, y };
  item.classList.add('dragging'); list.classList.add('sorting');
  if (navigator.vibrate) navigator.vibrate(15);
  const loop = () => {
    if (!DRAG) return;
    if (DRAG.y < 70) scrollBy(0, -10); else if (DRAG.y > innerHeight - 150) scrollBy(0, 10);
    dragUpdate(); DRAG.raf = requestAnimationFrame(loop);
  };
  DRAG.raf = requestAnimationFrame(loop);
}
function dragUpdate(){
  const d = DRAG, dy = d.y + scrollY - d.y0, r = d.rects[d.from], center = r.top + r.h / 2 + dy;
  d.item.style.transform = `translateY(${dy}px)`;
  let to = d.from;
  d.rects.forEach((q, i) => { const mid = q.top + q.h / 2; if (i < d.from && center < mid) to = Math.min(to, i); if (i > d.from && center > mid) to = Math.max(to, i); });
  d.to = to;
  const shift = r.h + d.gap;
  d.els.forEach((el, i) => {
    if (i === d.from) return;
    const t = d.from < to && i > d.from && i <= to ? -shift : to < d.from && i >= to && i < d.from ? shift : 0;
    el.style.transform = t ? `translateY(${t}px)` : '';
  });
}
function endDrag(){
  const d = DRAG; DRAG = null; cancelAnimationFrame(d.raf); lastDrag = Date.now();
  d.els.forEach(el => el.style.transform = ''); d.item.classList.remove('dragging'); d.list.classList.remove('sorting');
  if (d.from !== d.to) { if (navigator.vibrate) navigator.vibrate(10); d.list._onMove(d.from, d.to); }
}
function pointerMove(x, y, e){
  if (DRAG) { if (e.cancelable) e.preventDefault(); DRAG.y = y; return; }
  if (PRESS && (Math.abs(x - PRESS.x) > 8 || Math.abs(y - PRESS.y) > 8)) { clearTimeout(PRESS.timer); PRESS = null; }
}
function pointerEnd(){ if (PRESS) { clearTimeout(PRESS.timer); PRESS = null; } if (DRAG) endDrag(); }
document.addEventListener('touchmove', e => pointerMove(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
document.addEventListener('touchend', pointerEnd);
document.addEventListener('touchcancel', pointerEnd);
document.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY, e));
document.addEventListener('mouseup', pointerEnd);
document.addEventListener('click', e => { if (Date.now() - lastDrag < 400) { e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', e => { if (DRAG || PRESS) e.preventDefault(); });

/* Aviso rápido */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

/* Evolução */
function lineChart(pts, unidade){
  if (pts.length < 2) return `<p class="muted small">${pts.length ? 'Registre mais uma vez para ver o gráfico.' : 'Sem registros ainda.'}</p>`;
  const W = 320, H = 150, L = 34, R = 10, T = 12, B = 24;
  const ys = pts.map(p => p.y), min = Math.min(...ys), max = Math.max(...ys), span = (max - min) || 1;
  const lo = min - span * .15, hi = max + span * .15;
  const x = i => L + i * (W - L - R) / (pts.length - 1), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const ticks = [lo + (hi - lo) * .15, (lo + hi) / 2, hi - (hi - lo) * .15];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução">
    ${ticks.map(t => `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${+t.toFixed(1)}</text>`).join('')}
    <path class="ln" d="${d}"/>${pts.map((p, i) => `<circle class="dot" cx="${x(i)}" cy="${y(p.y)}" r="3.5"><title>${fmtData(p.x)}: ${p.y} ${unidade}</title></circle>`).join('')}
    <text x="${L}" y="${H - 6}">${fmtData(pts[0].x)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtData(pts[pts.length - 1].x)}</text></svg>`;
}
let calMes = new Date(); calMes.setDate(1);
function vEvolucao(){
  const set = new Set(S.checkins), y = calMes.getFullYear(), m = calMes.getMonth();
  const first = (new Date(y, m, 1).getDay() + 6) % 7, dias = new Date(y, m + 1, 0).getDate(), h = hoje();
  const noMes = S.checkins.filter(d => d.startsWith(`${y}-${pad(m + 1)}`)).length;
  const exUsados = [...new Set(S.sessoes.flatMap(s => s.itens.filter(i => i.carga !== '' && i.carga != null).map(i => i.ex)))];
  if (!evoEx || !exUsados.includes(evoEx)) evoEx = exUsados[0] || null;
  const cargas = evoEx ? S.sessoes.map(s => ({ x: s.data, it: s.itens.find(i => i.ex === evoEx) })).filter(o => o.it && o.it.carga !== '' && o.it.carga != null).map(o => ({ x: o.x, y: +o.it.carga })) : [];
  const pesos = [...S.pesos].sort((a, b) => a.data.localeCompare(b.data)).map(p => ({ x: p.data, y: p.kg }));
  const ultimas = S.sessoes.slice(-5).reverse();
  return `
    <div class="top"><h1>Evolução</h1></div>
    <div class="stack">
      <section class="card">
        <div class="row" style="justify-content:space-between">
          <button class="icon-btn" onclick="mudaMes(-1)" aria-label="Mês anterior">‹</button>
          <div style="text-align:center"><h3 style="text-transform:capitalize">${MESES[m]} ${y}</h3><span class="small muted">${noMes} check-in${noMes === 1 ? '' : 's'}</span></div>
          <button class="icon-btn" onclick="mudaMes(1)" aria-label="Próximo mês">›</button>
        </div>
        <div class="cal">${['S','T','Q','Q','S','S','D'].map(d => `<span>${d}</span>`).join('')}
          ${Array(first).fill('<i class="empty"></i>').join('')}
          ${Array.from({ length: dias }, (_, i) => { const d = `${y}-${pad(m + 1)}-${pad(i + 1)}`; return `<i class="${set.has(d) ? 'on' : ''} ${d === h ? 'today' : ''}">${i + 1}</i>`; }).join('')}
        </div>
        <div class="streak" style="margin-top:14px">
          <div class="stat"><b>${S.checkins.length}</b><span class="small muted">check-ins no total</span></div>
          <div class="stat"><b>${S.sessoes.length}</b><span class="small muted">treinos concluídos</span></div>
        </div>
      </section>
      <section class="card">
        <h3>Carga por exercício</h3>
        ${exUsados.length ? `<select style="margin-top:10px" onchange="evoEx=this.value;render()" aria-label="Exercício">${exUsados.map(id => `<option value="${id}" ${id === evoEx ? 'selected' : ''}>${esc(EX[id]?.nome || id)}</option>`).join('')}</select>${lineChart(cargas, 'kg')}`
          : '<p class="muted small">Registre a carga durante os treinos para acompanhar a evolução.</p>'}
      </section>
      <section class="card">
        <h3>Peso corporal</h3>
        <div class="row" style="margin-top:10px">
          <input type="number" inputmode="decimal" step="0.1" id="pesoIn" placeholder="kg" aria-label="Peso em kg">
          <input type="date" id="pesoData" value="${h}" aria-label="Data">
          <button class="btn primary" onclick="addPeso()">Salvar</button>
        </div>
        ${lineChart(pesos, 'kg')}
      </section>
      <section class="card">
        <h3>Últimos treinos</h3>
        ${ultimas.length ? ultimas.map(s => `<div class="list-item"><div class="grow"><b>${esc(s.nome)}</b><span class="small muted">${fmtData(s.data)} · ${s.minutos} min · ${s.itens.reduce((a, i) => a + i.series, 0)} séries</span></div></div>`).join('') : '<p class="muted small">Nenhum treino concluído ainda.</p>'}
      </section>
    </div>`;
}
function mudaMes(d){ calMes.setMonth(calMes.getMonth() + d); render(); }
function addPeso(){
  const kg = parseFloat($('#pesoIn').value.replace(',', '.')), data = $('#pesoData').value || hoje();
  if (!kg) return $('#pesoIn').focus();
  S.pesos = S.pesos.filter(p => p.data !== data); S.pesos.push({ data, kg }); save(); render();
}

/* Ajustes */
function vAjustes(){
  return `
    <div class="top"><h1>Ajustes</h1></div>
    <div class="stack">
      <section class="card stack">
        <label class="small muted" for="nm">Seu nome</label>
        <input type="text" id="nm" value="${esc(S.nome)}" onchange="S.nome=this.value.trim();save()">
      </section>
      <section class="card stack">
        <h3>Backup</h3>
        <p class="muted small" style="margin:0">Seus dados ficam salvos neste celular. Faça um backup de vez em quando para não perder nada se trocar de aparelho ou limpar o navegador.</p>
        <button class="btn" onclick="exportar()">Baixar backup</button>
        <label class="btn" style="text-align:center">Restaurar backup<input type="file" accept="application/json,.json" hidden onchange="importar(this.files[0])"></label>
      </section>
      <section class="card stack">
        <h3>Instalar no celular</h3>
        <p class="muted small" style="margin:0">iPhone: no Safari, toque em Compartilhar → <b>Adicionar à Tela de Início</b>.<br>Android: no Chrome, toque em ⋮ → <b>Instalar app</b>.</p>
      </section>
      <button class="btn ghost" style="color:var(--accent)" onclick="zerar()">Apagar todos os dados</button>
      <p class="muted small" style="text-align:center">As animações são ilustrativas. Para montar ou ajustar seu treino, conte com um profissional de educação física.</p>
    </div>`;
}
function exportar(){
  const b = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `ritmo-backup-${hoje()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importar(f){
  if (!f) return;
  try{ const d = JSON.parse(await f.text()); if (!d.planos) throw 0; if (!confirm('Substituir os dados atuais pelo backup?')) return; S = { ...defaultState(), ...d }; save(); view = 'hoje'; render(); alert('Backup restaurado.'); }
  catch{ alert('Esse arquivo não parece um backup do Ritmo.'); }
}
function zerar(){ if (!confirm('Apagar todos os treinos, check-ins e registros?')) return; S = defaultState(); save(); view = 'hoje'; render(); }

/* Diálogo */
function abrirDlg(html){ $('#dlgBody').innerHTML = html; const d = $('#dlg'); if (!d.open) d.showModal(); mountAnims($('#dlgBody')); }
function fecharDlg(){ $('#dlg').close(); }
$('#dlg').addEventListener('close', () => { $('#dlgBody').innerHTML = ''; });
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) fecharDlg(); });

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
